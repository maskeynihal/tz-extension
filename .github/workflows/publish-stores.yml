name: Publish to stores

# Submits a released version to the Chrome Web Store and/or Firefox Add-ons.
#
# - Called by release.yml after every release, with the release's own zips
#   passed in as a workflow artifact (so the stores get the exact files that
#   are attached to the GitHub release).
# - Run by hand (Actions > Publish to stores > Run workflow) to re-publish a
#   tag: downloads the zips attached to that tag's GitHub release and publishes
#   them. Works for any tag that has a GitHub release.
#
# The publish scripts always come from the commit this workflow runs on (main),
# never from the tag, so old tags that predate the scripts can be published.
#
# Each store is skipped with a warning when its secrets are missing, so
# releases stay green before the secrets are configured. Secrets live in the
# `store-publish` environment; see PUBLISHING.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (must have a GitHub release, e.g. v0.6.3)
        required: true
        type: string
      store:
        description: Which store(s) to publish to
        required: true
        default: both
        type: choice
        options: [both, chrome, firefox]
      cancel_pending:
        description: Chrome only. If an older version is still in review, cancel that review and submit this one instead.
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      store:
        required: false
        default: both
        type: string
      artifact:
        description: Name of a workflow artifact holding the release zips. Empty = download them from the tag's GitHub release.
        required: false
        default: ''
        type: string
      cancel_pending:
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  publish:
    name: ${{ matrix.store }}
    runs-on: ubuntu-latest
    environment: store-publish
    permissions:
      contents: read # checkout + gh release download
    timeout-minutes: 30
    strategy:
      # A Chrome failure must not cancel the Firefox submission (and vice versa).
      fail-fast: false
      matrix:
        store: ${{ fromJSON(inputs.store == 'both' && '["chrome","firefox"]' || format('["{0}"]', inputs.store)) }}
    # Never run two submissions to the same store at once, across both the
    # release-triggered and the manual path.
    concurrency:
      group: store-publish-${{ matrix.store }}
      cancel-in-progress: false
    env:
      TAG: ${{ inputs.tag }}
      STORE: ${{ matrix.store }}
      PKG_DIR: ${{ github.workspace }}/packages
    steps:
      - name: Validate inputs
        id: meta
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must look like v1.2.3 (got '$TAG')"
            exit 1
          fi
          case "$STORE" in chrome|firefox) ;; *) echo "::error::unknown store '$STORE'"; exit 1 ;; esac
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check store credentials
        id: creds
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ "$STORE" = chrome ]; then
            names="CWS_CLIENT_ID CWS_CLIENT_SECRET CWS_REFRESH_TOKEN CWS_PUBLISHER_ID"
            label="Chrome Web Store"
          else
            names="AMO_JWT_ISSUER AMO_JWT_SECRET"
            label="Firefox Add-ons"
          fi
          missing=""
          for n in $names; do
            if [ -z "${!n}" ]; then missing="$missing $n"; fi
          done
          if [ -n "$missing" ]; then
            echo "::warning title=$label publish skipped::Missing secrets:$missing. Add them to the store-publish environment (see PUBLISHING.md) and re-run with the 'Publish to stores' workflow."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # Tooling comes from this workflow's own commit, not the tag. Full history
      # so tags are available to scripts/source-archive.mjs.
      - name: Checkout publish tooling
        if: steps.creds.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        if: steps.creds.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ matrix.store == 'firefox' && 'npm' || '' }}

      # Only Firefox needs dependencies (web-ext). The Chrome publisher has none.
      - name: Install dependencies
        if: steps.creds.outputs.ok == 'true' && matrix.store == 'firefox'
        run: npm ci

      - name: Download release packages (artifact)
        if: steps.creds.outputs.ok == 'true' && inputs.artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: packages

      - name: Download release packages (GitHub release)
        if: steps.creds.outputs.ok == 'true' && inputs.artifact == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! err=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName 2>&1 >/dev/null); then
            echo "::error::No GitHub release found for $TAG in $GITHUB_REPOSITORY. Only tags with a GitHub release can be re-published. (gh: ${err//$'\n'/ })"
            exit 1
          fi
          mkdir -p "$PKG_DIR"
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'tz-extension-*.zip' --dir "$PKG_DIR"; then
            echo "::error::Could not download the tz-extension-*.zip assets of release $TAG (see the gh output above)."
            exit 1
          fi
          want="$PKG_DIR/tz-extension-$STORE.zip"
          if [ ! -f "$want" ]; then
            echo "::error::Release $TAG has no $(basename "$want") asset."
            exit 1
          fi
          if [ "$STORE" = firefox ] && [ ! -f "$PKG_DIR/tz-extension-source.zip" ]; then
            echo "::notice::Release $TAG has no tz-extension-source.zip asset (older release); generating it from the tag."
            node scripts/source-archive.mjs --ref "$TAG" --out "$PKG_DIR/tz-extension-source.zip"
          fi
          ls -l "$PKG_DIR"

      - name: Publish to Chrome Web Store
        if: steps.creds.outputs.ok == 'true' && matrix.store == 'chrome'
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          VERSION: ${{ steps.meta.outputs.version }}
          CANCEL_PENDING: ${{ inputs.cancel_pending }}
        run: |
          extra=()
          if [ "$CANCEL_PENDING" = true ]; then extra+=(--cancel-pending); fi
          node scripts/publish-chrome.mjs --zip "$PKG_DIR/tz-extension-chrome.zip" --expect-version "$VERSION" "${extra[@]}"

      - name: Publish to Firefox Add-ons
        if: steps.creds.outputs.ok == 'true' && matrix.store == 'firefox'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: >-
          node scripts/publish-firefox.mjs
          --zip "$PKG_DIR/tz-extension-firefox.zip"
          --source "$PKG_DIR/tz-extension-source.zip"
          --expect-version "$VERSION"
